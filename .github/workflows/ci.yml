name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/runtime.txt
          pip install -r requirements/dev.txt

      - name: Lint
        run: ruff check app src tests

      - name: Check formatting
        run: ruff format --check app src tests

      - name: Prepare MLflow test registry
        env:
          MLFLOW_TRACKING_URI: sqlite:///mlflow_ci.db
        run: |
          python - <<'PY'
          import joblib
          import mlflow
          import mlflow.sklearn

          model = joblib.load("models/late_delivery_model.joblib")

          mlflow.set_tracking_uri("sqlite:///mlflow_ci.db")
          mlflow.set_experiment("ci-tests")

          with mlflow.start_run():
              mlflow.sklearn.log_model(
                  model,
                  name="model",
                  registered_model_name="olist-late-delivery-model",
              )
          PY

      - name: Run tests
        env:
          PYTHONPATH: .
          MLFLOW_TRACKING_URI: sqlite:///mlflow_ci.db
        run: python -m pytest -q

      - name: Build Docker image
        run: docker build -t olist-mlops:latest .